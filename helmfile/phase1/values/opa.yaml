replicaCount: 2

nodeSelector:
  role: system

# OPA runs as a sidecar-style service; OPAL keeps policies in sync
opa:
  enabled: true

# Policy loaded via opa-load-policies.sh hook after deploy
# OPAL sidecar watches Consul KV for policy updates

mgmt:
  enabled: true
  configmapPolicies:
    enabled: true
    namespaces: [infra]
    requireLabel: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

service:
  type: ClusterIP
  port: 8181
