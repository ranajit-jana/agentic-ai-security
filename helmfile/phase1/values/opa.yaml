replicaCount: 2

image:
  repository: 923373850235.dkr.ecr.ap-south-1.amazonaws.com/mirror/opa
  tag: "0.40.0"

nodeSelector:
  role: system

# Disable the default OPA config to avoid the quickstart bundle (uses rego.v1 syntax
# not supported by OPA 0.40.0). Policies are loaded via kube-mgmt and hook scripts.
opa: false

authz:
  enabled: false

# Policy loaded via opa-load-policies.sh hook after deploy
# OPAL sidecar watches Consul KV for policy updates

mgmt:
  enabled: true
  image:
    repository: 923373850235.dkr.ecr.ap-south-1.amazonaws.com/mirror/kube-mgmt
    tag: "4.1.1"
  configmapPolicies:
    enabled: true
    namespaces: [infra]
    requireLabel: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

service:
  type: ClusterIP
  port: 443

# Expose an HTTP listener on 8282 for OPAL client (avoids collision with localhost:8181)
extraArgs:
  - "--addr=http://0.0.0.0:8282"

extraPorts:
  - port: 8282
    protocol: TCP
    name: http
    targetPort: 8282
