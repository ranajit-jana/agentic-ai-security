global:
  enabled: true
  tlsDisable: true

injector:
  enabled: false   # using EKS Pod Identity, not Vault agent injector

server:
  image:
    repository: 923373850235.dkr.ecr.ap-south-1.amazonaws.com/mirror/vault
    tag: "1.21.2"

  nodeSelector:
    role: system

  affinity: ""

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # AWS KMS auto-unseal — no manual unseal needed on pod restart
  extraEnvironmentVars:
    VAULT_SEAL_TYPE: awskms
    VAULT_AWSKMS_SEAL_KEY_ID: "09bab559-b3ab-45f4-a437-d3b32aed7fbc"
    AWS_REGION: "ap-south-1"

  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address     = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        seal "awskms" {
          region     = "ap-south-1"
          kms_key_id = "09bab559-b3ab-45f4-a437-d3b32aed7fbc"
        }

        storage "raft" {
          path    = "/vault/data"

          retry_join {
            leader_api_addr = "http://vault-0.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-1.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-2.vault-internal:8200"
          }
        }

        service_registration "kubernetes" {}

  serviceAccount:
    create: true
    name: vault
    annotations:
      # EKS Pod Identity binds vault-unseal-role to this service account
      eks.amazonaws.com/role-arn: ""

ui:
  enabled: true
  serviceType: ClusterIP
