global:
  spire:
    trustDomain: firm.internal
    clusterName: agentic-security

spire-server:
  nodeSelector:
    role: system
  replicaCount: 1
  ca:
    keyType: ec-p256
    subject:
      country: US
      organization: firm.internal
  controllerManager:
    enabled: true
  federation:
    enabled: false

  # k8s_sat node attestor — cloud-agnostic, works on any K8s
  nodeAttestor:
    k8sPSAT:
      enabled: true
      serviceAccountAllowList:
        - spire-system:spire-agent

  # Workload attestor identifies pods by namespace + service account
  workloadAttestor:
    k8s:
      enabled: true

  # SPIRE entries for agent workloads registered via postsync hook

spire-agent:
  nodeSelector: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

spiffe-oidc-discovery-provider:
  enabled: true
  nodeSelector:
    role: system

spiffe-csi-driver:
  enabled: true
