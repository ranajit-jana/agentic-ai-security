fullnameOverride: ollama-embed

image:
  repository: 923373850235.dkr.ecr.ap-south-1.amazonaws.com/mirror/ollama
  tag: "0.23.2"

ollama:
  gpu:
    enabled: false
  models:
    pull:
      - nomic-embed-text:v1.5

persistentVolume:
  enabled: true
  existingClaim: ollama-models-shared

nodeSelector:
  role: inference

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi
