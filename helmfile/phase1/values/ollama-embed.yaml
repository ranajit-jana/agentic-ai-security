fullnameOverride: ollama-embed

ollama:
  gpu:
    enabled: false
  models:
    pull:
      - nomic-embed-text:v1.5

persistentVolume:
  enabled: true
  existingClaim: ollama-models-shared

nodeSelector:
  role: inference

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi
