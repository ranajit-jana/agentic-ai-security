mode: deployment

image:
  repository: 923373850235.dkr.ecr.ap-south-1.amazonaws.com/mirror/otel-collector
  tag: "0.152.0"

replicaCount: 2

nodeSelector:
  role: observability

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 5s
      send_batch_size: 1000
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25

  exporters:
    otlphttp/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
    otlp/tempo:
      endpoint: http://tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true

  service:
    pipelines:
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/loki]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
