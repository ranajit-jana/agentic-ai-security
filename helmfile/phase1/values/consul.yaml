global:
  name: consul
  datacenter: dc1
  tls:
    enabled: true
    enableAutoEncrypt: true
  acls:
    manageSystemACLs: true
  gossipEncryption:
    autoGenerate: true

server:
  replicas: 3
  nodeSelector:
    role: system
  storage: 10Gi
  storageClass: gp2

client:
  enabled: true
  grpc: true

connectInject:
  enabled: false

ui:
  enabled: true
  service:
    type: ClusterIP

dns:
  enabled: true
  enableRedirection: true
