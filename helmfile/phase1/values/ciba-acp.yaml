image:
  repository: "923373850235.dkr.ecr.ap-south-1.amazonaws.com/agentic/ciba-acp"
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 2

nodeSelector:
  role: system

service:
  type: ClusterIP
  port: 8000

serviceAccount:
  name: ciba-acp

env:
  KEYCLOAK_URL: "http://keycloak.infra.svc.cluster.local"
  KEYCLOAK_REALM: "firm-internal"
  SNS_TOPIC_ARN: "arn:aws:sns:ap-south-1:923373850235:ciba-approvals"
  AWS_REGION: "ap-south-1"
  LOG_LEVEL: "WARNING"
  LOG_FORMAT: "json"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
