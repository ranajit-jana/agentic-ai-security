fullnameOverride: ollama-judge

ollama:
  gpu:
    enabled: false
  models:
    pull:
      - llama3.1:8b

persistentVolume:
  enabled: true
  existingClaim: ollama-models-shared

nodeSelector:
  role: inference

resources:
  requests:
    cpu: 500m
    memory: 6Gi
  limits:
    cpu: 4000m
    memory: 12Gi
