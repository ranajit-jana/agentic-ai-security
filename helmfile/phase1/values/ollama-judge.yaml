fullnameOverride: ollama-judge

image:
  repository: 923373850235.dkr.ecr.ap-south-1.amazonaws.com/mirror/ollama
  tag: "0.23.2"

ollama:
  gpu:
    enabled: false
  models:
    pull:
      - llama3.1:8b

persistentVolume:
  enabled: true
  existingClaim: ollama-models-shared

nodeSelector:
  role: inference

resources:
  requests:
    cpu: 500m
    memory: 6Gi
  limits:
    cpu: 4000m
    memory: 12Gi
