ecrRegistry: "923373850235.dkr.ecr.ap-south-1.amazonaws.com"
imageTag: "0.1.0"
imagePullPolicy: Always

nodeSelector:
  role: application

sharedEnv:
  ANTHROPIC_MODEL: "claude-sonnet-4-6"
  GATEWAY_URL: "http://security-gateway.infra.svc.cluster.local:8080"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  OTEL_SERVICE_NAMESPACE: "agents"
  TRUST_DOMAIN: "firm.internal"
  LOG_FORMAT: "json"
  # Set ANTHROPIC_API_KEY via Vault secret injection before deploying agents
  ANTHROPIC_API_KEY: ""

spireSocket:
  hostPath: /tmp/spire-agent/public

agents:
  orchestrator:
    name: orchestrator-agent
    image: agentic/orchestrator-agent
    replicas: 2
    serviceAccount: orchestrator-agent
    port: 8000
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  webSearch:
    name: web-search-agent
    image: agentic/web-search-agent
    replicas: 2
    serviceAccount: web-search-agent
    port: 8000
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  internalData:
    name: internal-data-agent
    image: agentic/internal-data-agent
    replicas: 2
    serviceAccount: internal-data-agent
    port: 8000
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  reportGeneration:
    name: report-generation-agent
    image: agentic/report-generation-agent
    replicas: 2
    serviceAccount: report-generation-agent
    port: 8000
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  email:
    name: email-agent
    image: agentic/email-agent
    replicas: 1
    serviceAccount: email-agent
    port: 8000
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
