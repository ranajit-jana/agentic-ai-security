daemonSetVolumes:
  - name: spire-socket
    hostPath:
      path: /tmp/spire-agent/public
      type: DirectoryOrCreate

config:
  inputs: |
    [INPUT]
        Name              kubearmor
        Tag               kubearmor.*
        kubearmor_endpoint  kubearmor-relay.kubearmor-system.svc.cluster.local:32767

  filters: |
    [FILTER]
        Name   record_modifier
        Match  kubearmor.*
        Record source kubearmor
        Record cluster agentic-security

  outputs: |
    # Ship to Loki for Grafana KubeArmor Runtime dashboard
    [OUTPUT]
        Name            loki
        Match           kubearmor.*
        Host            loki.observability.svc.cluster.local
        Port            3100
        Labels          job=kubearmor, source=kubearmor
        Line_Format     json

    # Ship to Kafka for Flink CEP correlation
    # OpenSearch output removed — correlation handled by Flink + ClickHouse.
    # See docs/observability.md "OpenSearch Decision Record" for reasoning.
    [OUTPUT]
        Name        kafka
        Match       kubearmor.*
        Brokers     kafka.observability.svc.cluster.local:9092
        Topics      kubearmor-events
        rdkafka.log.connection.close  false

tolerations:
  - operator: Exists
