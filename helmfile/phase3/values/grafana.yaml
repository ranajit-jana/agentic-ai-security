# ClickHouse datasource replaces OpenSearch.
# OpenSearch removed — see docs/observability.md "OpenSearch Decision Record".
# ClickHouse is 50x faster for aggregation queries and fits on existing nodes.

additionalDataSources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    url: http://clickhouse.observability.svc.cluster.local:8123
    jsonData:
      defaultDatabase: security
      username: default
    secureJsonData:
      password: "${CLICKHOUSE_PASSWORD}"

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: posture
        folder: Security Posture
        type: file
        options:
          path: /var/lib/grafana/dashboards/posture
