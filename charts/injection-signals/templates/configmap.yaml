apiVersion: v1
kind: ConfigMap
metadata:
  name: injection-build-scripts
  namespace: {{ .Release.Namespace }}
data:
  build_injection_embeddings.py: |
    import argparse
    import os
    import pickle
    import json
    import requests

    def get_embedding(text, model, ollama_url):
        resp = requests.post(
            f"{ollama_url}/api/embeddings",
            json={"model": model, "prompt": text},
            timeout=30
        )
        resp.raise_for_status()
        return resp.json()["embedding"]

    def load_taxonomy(taxonomy_path):
        signals = []
        for root, _, files in os.walk(taxonomy_path):
            for f in files:
                if f.endswith((".yaml", ".yml", ".md")):
                    with open(os.path.join(root, f)) as fh:
                        signals.append(fh.read())
        return signals

    def main():
        parser = argparse.ArgumentParser()
        parser.add_argument("--taxonomy", required=True)
        parser.add_argument("--output", required=True)
        parser.add_argument("--model", default="nomic-embed-text")
        parser.add_argument("--ollama-url", required=True)
        args = parser.parse_args()

        print(f"Loading taxonomy from {args.taxonomy}...")
        signals = load_taxonomy(args.taxonomy)
        print(f"Found {len(signals)} signal documents")

        print("Generating embeddings...")
        index = []
        for i, text in enumerate(signals):
            embedding = get_embedding(text[:2000], args.model, args.ollama_url)
            index.append({"text": text[:500], "embedding": embedding})
            if (i + 1) % 10 == 0:
                print(f"  {i + 1}/{len(signals)} done")

        with open(args.output, "wb") as f:
            pickle.dump(index, f)

        print(f"Index saved to {args.output} ({len(index)} entries)")

    if __name__ == "__main__":
        main()
